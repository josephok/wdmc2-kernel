# This is a basic workflow to help you get started with Actions

name: compile kernel using ghrunner settings

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  #pull_request:
  #  branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-kernel:
    # Use a GitHub-hosted runner (no self-hosted runner is registered/online,
    # which previously caused jobs to wait 24h for a runner and get cancelled)
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with: 
          clean: 'false'

      # --ghrunner skips build.sh's own prerequisite install/root-check, so
      # the hosted runner's fresh VM needs them installed explicitly here.
      - name: install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc dialog u-boot-tools git \
            libncurses-dev libmpc-dev libmpfr-dev libgmp3-dev flex bison \
            debootstrap debian-archive-keyring qemu-user-static gcc-arm-linux-gnueabihf

      # Runs a single command using the runners shell
      - name: run build script for kernel 6.12.y
        run: ./build.sh --ghrunner --kernel --kernelbranch linux-6.12.y

      # Upload build results
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: build-results
      #     path: output/*.tar.gz

      # Upload build release
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            output/*.gz
            LICENSE.md
            README.md
